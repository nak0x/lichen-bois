<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fond papier millimétré beige -->
  <rect width="64" height="64" fill="#EBE5DF"/>

  <!-- Grille mineure (toutes les 4px) -->
  <g stroke="#D8CEC5" stroke-width="0.5" opacity="0.7">
    <line x1="4" y1="0" x2="4" y2="64"/>
    <line x1="8" y1="0" x2="8" y2="64"/>
    <line x1="12" y1="0" x2="12" y2="64"/>
    <line x1="20" y1="0" x2="20" y2="64"/>
    <line x1="24" y1="0" x2="24" y2="64"/>
    <line x1="28" y1="0" x2="28" y2="64"/>
    <line x1="36" y1="0" x2="36" y2="64"/>
    <line x1="40" y1="0" x2="40" y2="64"/>
    <line x1="44" y1="0" x2="44" y2="64"/>
    <line x1="52" y1="0" x2="52" y2="64"/>
    <line x1="56" y1="0" x2="56" y2="64"/>
    <line x1="60" y1="0" x2="60" y2="64"/>
    <line x1="0" y1="4" x2="64" y2="4"/>
    <line x1="0" y1="8" x2="64" y2="8"/>
    <line x1="0" y1="12" x2="64" y2="12"/>
    <line x1="0" y1="20" x2="64" y2="20"/>
    <line x1="0" y1="24" x2="64" y2="24"/>
    <line x1="0" y1="28" x2="64" y2="28"/>
    <line x1="0" y1="36" x2="64" y2="36"/>
    <line x1="0" y1="40" x2="64" y2="40"/>
    <line x1="0" y1="44" x2="64" y2="44"/>
    <line x1="0" y1="52" x2="64" y2="52"/>
    <line x1="0" y1="56" x2="64" y2="56"/>
    <line x1="0" y1="60" x2="64" y2="60"/>
  </g>

  <!-- Grille majeure (toutes les 16px) -->
  <g stroke="#A9978A" stroke-width="0.75" opacity="0.6">
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="32" y1="0" x2="32" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
    <line x1="0" y1="16" x2="64" y2="16"/>
    <line x1="0" y1="32" x2="64" y2="32"/>
    <line x1="0" y1="48" x2="64" y2="48"/>
  </g>

  <!-- Lettre L en pixels (3×5 blocs de 8px, centrée) -->
  <!-- L : colonne gauche + ligne du bas -->
  <!-- Position : x=16, y=12, chaque pixel = 8×8 -->
  <!-- L pixel art :
       X . .
       X . .
       X . .
       X . .
       X X X  -->
  <g fill="#1B1A17">
    <!-- Colonne gauche -->
    <rect x="16" y="12" width="8" height="8"/>
    <rect x="16" y="20" width="8" height="8"/>
    <rect x="16" y="28" width="8" height="8"/>
    <rect x="16" y="36" width="8" height="8"/>
    <!-- Ligne du bas -->
    <rect x="16" y="44" width="8" height="8"/>
    <rect x="24" y="44" width="8" height="8"/>
    <rect x="32" y="44" width="8" height="8"/>
  </g>
</svg>
